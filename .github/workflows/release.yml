name: release-desktop

on:
  push:
    tags:
      - "v0.3.0"
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Build complete runtime (Pi + Backend + Agent + Manifest)
        shell: pwsh
        run: ./scripts/build-runtime.ps1
      - name: Verify release runtime (manifest + critical files + Pi commit)
        shell: pwsh
        run: ./scripts/verify-release-runtime.ps1
      - name: Verify bundled backend
        shell: pwsh
        run: ./scripts/verify-backend-exe.ps1
      - name: Build NSIS installer
        working-directory: desktop
        run: |
          npm ci
          npm run tauri:build
      - name: Collect release artifact and checksum
        shell: pwsh
        run: |
          $version = "0.3.0"
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem -Path desktop/src-tauri/target/release/bundle/nsis -Filter "*setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          $destination = "release/ECOMIC-Setup-$version.exe"
          Copy-Item $installer.FullName $destination -Force
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath release/SHA256SUMS.txt -Value "$hash  ECOMIC-Setup-$version.exe" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: ECOMIC-Desktop-0.3.0-Windows
          path: |
            release/ECOMIC-Setup-0.3.0.exe
            release/SHA256SUMS.txt
            release/runtime/ecomic-agent/runtime-manifest.json
          if-no-files-found: error
