name: validation

'on':
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_pi:
        description: "Run external Pi model-data hydration/build gate (requires models.dev access)"
        required: false
        default: false
        type: boolean

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m unittest discover -s tests_agent -p "test_*.py" -v
  node-security-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests_node/*.test.mjs
  pi-runtime-manual-integration:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_pi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: git clone --depth 1 https://github.com/earendil-works/pi vendor/pi
      - run: npm install --ignore-scripts
        working-directory: vendor/pi
      - run: npm run hydrate:model-data && npm run build:offline
        working-directory: vendor/pi
      - run: node vendor/pi/packages/coding-agent/dist/cli.js --help
      - name: Load every ECOMIC Pi extension
        run: >-
          node vendor/pi/packages/coding-agent/dist/cli.js
          --extension agent/src/pi-extension.ts
          --extension agent/src/ecomic-api-runtime.ts
          --extension agent/src/ecomic-research-loop-tools.ts
          --extension agent/src/ecomic-workbench.ts
          --extension agent/src/ecomic-history.ts
          --help
  desktop-ui-and-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop
      - run: npm run test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml