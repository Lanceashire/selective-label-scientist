name: validation

'on':
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_pi:
        description: "Run external Pi model-data hydration/build gate (requires models.dev access)"
        required: false
        default: false
        type: boolean

jobs:
  # Gate 1: Python Scientific Backend
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m unittest discover -s tests_agent -p "test_*.py" -v

  # Gate 2: Node / Pi Runtime Import (real import, not regex)
  node-security-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests_node/*.test.mjs

  # Gate 3: Pi Bootstrap + Runtime Import (manual trigger, requires network)
  pi-bootstrap-and-runtime:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_pi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap Pi Runtime from .pi-version
        shell: pwsh
        run: ./scripts/bootstrap-pi-runtime.ps1
      - name: Verify Pi Agent Core can be imported
        run: node -e "require('./vendor/pi/packages/agent/dist/index.js'); console.log('Pi Agent Core: OK')"
      - name: Verify Pi AI Runtime can be imported
        run: node -e "require('./vendor/pi/packages/ai/dist/index.js'); console.log('Pi AI: OK')"
      - name: Verify Pi Models can be imported
        run: node -e "require('./vendor/pi/packages/ai/dist/models.js'); console.log('Pi Models: OK')"
      - run: node vendor/pi/packages/coding-agent/dist/cli.js --help
      - name: Load every ECOMIC Pi extension
        run: >-
          node vendor/pi/packages/coding-agent/dist/cli.js
          --extension agent/src/pi-extension.ts
          --extension agent/src/ecomic-api-runtime.ts
          --extension agent/src/ecomic-research-loop-tools.ts
          --extension agent/src/ecomic-workbench.ts
          --extension agent/src/ecomic-history.ts
          --help

  # Gate 4: Frontend tests + TypeScript + build
  # Gate 5: Rust cargo check + cargo test
  # Gate 6: Bundled Python Backend Integration
  desktop-ui-and-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # Gate 4: Frontend
      - run: npm ci
        working-directory: desktop
      - run: npm run test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: Verify production bundle excludes WDIO/WebDriver
        shell: pwsh
        run: ./scripts/verify-production-bundle.ps1
      # Gate 5: Rust
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Verify Windows desktop cleanup and diagnostic redaction
        shell: pwsh
        run: cargo test --release --manifest-path desktop/src-tauri/Cargo.toml process_cleanup_tests -- --nocapture
      # Gate 6: Bundled Python Backend
      - name: Build bundled Python runtime for non-health desktop RPC E2E
        shell: pwsh
        run: ./scripts/build-backend.ps1
      - name: Validate bundled backend non-health RPC workflow
        shell: pwsh
        run: ./scripts/verify-backend-exe.ps1

  # Gate 7: Scientist Runtime Integration (real Pi Agent Core + real Python worker)
  scientist-integration:
    needs: desktop-ui-and-rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Bootstrap Pi Runtime from .pi-version
        shell: pwsh
        run: ./scripts/bootstrap-pi-runtime.ps1
      - name: Run real Scientist Integration Test (Pi Agent Core + Python worker + mock provider)
        shell: pwsh
        env:
          ECOMIC_PYTHON: python
        run: node --test tests_node/scientist_integration.test.mjs
