name: validation

'on':
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_pi:
        description: "Run external Pi model-data hydration/build gate (requires models.dev access)"
        required: false
        default: false
        type: boolean

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.10"
          - "3.12"
          - "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package
        run: pip install -e .
      - name: Run Python tests
        run: python -m unittest discover -s tests_agent -p "test_*.py" -v

  node-security-and-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Node tests
        run: node --test tests_node/*.test.mjs

  pi-runtime-manual-integration:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_pi == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clone Pi
        run: git clone --depth 1 https://github.com/earendil-works/pi vendor/pi
      - name: Install Pi dependencies
        run: npm install --ignore-scripts
        working-directory: vendor/pi
      - name: Hydrate Pi model data and build
        run: npm run hydrate:model-data && npm run build:offline
        working-directory: vendor/pi
      - name: Test Pi CLI
        run: node vendor/pi/packages/coding-agent/dist/cli.js --help
      - name: Load ECOMIC Pi extensions
        run: >-
          node vendor/pi/packages/coding-agent/dist/cli.js
          --extension agent/src/pi-extension.ts
          --extension agent/src/ecomic-workbench.ts
          --extension agent/src/ecomic-history.ts
          --help
