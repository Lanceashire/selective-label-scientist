[package]
name = "ecomic-desktop"
version = "0.3.0"
description = "ECOMIC Desktop local AI Scientist workbench"
authors = ["ECOMIC"]
edition = "2021"

[lib]
name = "ecomic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
keyring = { version = "3.6.2", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-wdio = "1"
tauri-plugin-wdio-webdriver = "1.3.0"
